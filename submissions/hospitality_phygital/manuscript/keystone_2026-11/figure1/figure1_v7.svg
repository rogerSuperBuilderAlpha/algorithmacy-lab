<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="30" y="36" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#111">A   What binds the duty, and what it contains</text>
<rect x="110" y="52" width="360" height="70" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="290.0" y="82.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Holding out</text>
<text x="290.0" y="102.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">settles who took up the role, and when</text>
<line x1="290" y1="122" x2="410" y2="164" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="570" y="52" width="360" height="70" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="750.0" y="82.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">The guest's reliance</text>
<text x="750.0" y="102.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">makes the duty run to this guest</text>
<line x1="750" y1="122" x2="750" y2="164" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1030" y="52" width="360" height="70" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="1210.0" y="82.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Control of the guest's space</text>
<text x="1210.0" y="102.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">keeps a notice from exhausting it</text>
<line x1="1210" y1="122" x2="1090" y2="164" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="300" y="166" width="900" height="46" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="750.0" y="194.6" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">The role of host specifies the duty: its content, when it arises, and who holds it</text>
<line x1="560" y1="212" x2="430" y2="248" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="940" y1="212" x2="1070" y2="248" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="130" y="250" width="600" height="128" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="430.0" y="289.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Before the stay: admission</text>
<text x="430.0" y="309.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">the duty to receive travellers (hotel proprietors)</text>
<text x="430.0" y="329.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">not to refuse a guest on a protected ground</text>
<text x="430.0" y="349.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">(every provider of services, Great Britain)</text>
<rect x="770" y="250" width="600" height="128" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="1070.0" y="279.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">During the stay: reception</text>
<text x="1070.0" y="299.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">reasonable care for the guest's safety</text>
<text x="1070.0" y="319.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">services performed with care (traders to consumers)</text>
<text x="1070.0" y="339.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">safe keeping of goods (innkeepers)</text>
<text x="1070.0" y="359.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">reasonable adjustments (disabled guests)</text>
<text x="30" y="424" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#111">B   Who holds it when others do the work</text>
<rect x="40" y="440" width="264" height="96" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="172.0" y="473.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Owner and operator</text>
<text x="172.0" y="493.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">hold the duty of care,</text>
<text x="172.0" y="513.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">each to its degree of control</text>
<rect x="325" y="440" width="264" height="96" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="457.0" y="473.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Brand</text>
<text x="457.0" y="493.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">may answer as the</text>
<text x="457.0" y="513.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">operator's principal (agency)</text>
<rect x="610" y="440" width="264" height="96" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="742.0" y="473.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Booking platform</text>
<text x="742.0" y="493.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">answers as provider only where</text>
<text x="742.0" y="513.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">it acts or appears as one</text>
<rect x="895" y="440" width="264" height="96" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="1027.0" y="473.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Software maker</text>
<text x="1027.0" y="493.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">answers to the guest for defective</text>
<text x="1027.0" y="513.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">products (EU, from December 2026)</text>
<rect x="1180" y="440" width="264" height="96" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="1312.0" y="473.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Placing public body</text>
<text x="1312.0" y="493.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">keeps its public duty</text>
<text x="1312.0" y="513.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">when contractors perform it</text>
<text x="750.0" y="566" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#111">What stays with the host depends on the duty and on the doctrine that governs it.</text>
<text x="30" y="612" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" text-anchor="start" fill="#111">C   During the stay: the further duty (the paper's own step)</text>
<rect x="40" y="676" width="200" height="80" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="140.0" y="711.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Guest</text>
<text x="140.0" y="731.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">inside the host's space</text>
<line x1="240" y1="716" x2="288" y2="716" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="290" y="676" width="220" height="80" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="400.0" y="711.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">A failure in</text>
<text x="400.0" y="731.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">the guest's case</text>
<line x1="510" y1="716" x2="558" y2="716" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="560" y="676" width="220" height="80" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="670.0" y="711.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Touchpoint</text>
<text x="670.0" y="731.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">staff or system</text>
<line x1="780" y1="716" x2="828" y2="716" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="830" y="676" width="300" height="80" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="980.0" y="711.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Someone able to correct it</text>
<text x="980.0" y="731.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">power over the single case</text>
<line x1="1130" y1="716" x2="1178" y2="716" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1180" y="676" width="280" height="80" rx="6" fill="#e6e6e6" stroke="#222" stroke-width="1.6"/>
<text x="1320.0" y="711.25" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" text-anchor="middle" fill="#111">Correction</text>
<text x="1320.0" y="731.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">while the stay lasts</text>
<path d="M 40 664 L 40 654 L 1130 654 L 1130 664" fill="none" stroke="#222" stroke-width="1.3"/>
<text x="585" y="632" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">some timely means by which the failure reaches them; where only the guest perceives it,</text>
<text x="585" y="649" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">a route the guest can use without depending on the host's goodwill</text>
<line x1="880" y1="756" x2="840" y2="800" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="700" y="818" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="italic" text-anchor="middle" fill="#111">automation can move this person behind the machine</text>
<rect x="300" y="846" width="700" height="58" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="650.0" y="870.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">Among several firms, the party in control of the guest's space routes the report</text>
<text x="650.0" y="889.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">to the firm with power over the failing part (our proposal)</text>
<line x1="1000" y1="860" x2="1050" y2="758" stroke="#222" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6,5"/>
<line x1="1320" y1="756" x2="1320" y2="844" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1120" y="846" width="340" height="58" rx="6" fill="#ffffff" stroke="#222" stroke-width="1.6"/>
<text x="1290.0" y="870.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">After the stay: repair, and</text>
<text x="1290.0" y="890.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" text-anchor="middle" fill="#111">accountability before a forum</text>
<text x="30" y="944" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">Unshaded: the paper's reading of the field, the philosophy and the law (Sections 2 and 3).   Shaded: the further duty, the paper's own step.   Dashed: a proposal.</text>
</svg>