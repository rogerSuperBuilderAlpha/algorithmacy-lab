<svg xmlns="http://www.w3.org/2000/svg" width="1950" height="1950" viewBox="0 0 650 650" font-family="Times New Roman, Times, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="650" height="650" fill="#fff"/>
  <g transform="translate(0,60)">
    <!-- apex -->
    <rect x="205" y="20" width="240" height="62" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="325" y="46" text-anchor="middle" font-size="17" font-weight="bold">Platform (apex)</text>
    <text x="325" y="68" text-anchor="middle" font-size="14">opaque · binding · adaptive</text>

    <!-- corners -->
    <rect x="20" y="400" width="170" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="105" y="434" text-anchor="middle" font-size="17">Participant</text>
    <rect x="460" y="400" width="170" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="545" y="434" text-anchor="middle" font-size="17">Counterpart</text>

    <!-- apex to corners -->
    <line x1="280" y1="84" x2="120" y2="396" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="370" y1="84" x2="530" y2="396" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="105" y="230" text-anchor="middle" font-size="13">evaluates and binds</text>
    <text x="105" y="247" text-anchor="middle" font-size="13">(asymmetrically)</text>
    <text x="545" y="230" text-anchor="middle" font-size="13">evaluates and binds</text>
    <text x="545" y="247" text-anchor="middle" font-size="13">(asymmetrically)</text>

    <!-- exchange between corners -->
    <line x1="194" y1="428" x2="456" y2="428" stroke="#777" stroke-width="1.4" stroke-dasharray="6,5"/>
    <text x="325" y="418" text-anchor="middle" font-size="13" fill="#555">interdependent exchange</text>

    <!-- the three parts, inside the triangle -->
    <rect x="258" y="150" width="134" height="44" rx="6" fill="#eee" stroke="#555"/>
    <text x="325" y="169" text-anchor="middle" font-size="14">Interpreting</text>
    <text x="325" y="186" text-anchor="middle" font-size="12">(answers opacity)</text>

    <rect x="337" y="300" width="134" height="44" rx="6" fill="#eee" stroke="#555"/>
    <text x="404" y="319" text-anchor="middle" font-size="14">Specifying intent</text>
    <text x="404" y="336" text-anchor="middle" font-size="12">(answers binding)</text>

    <rect x="179" y="300" width="134" height="44" rx="6" fill="#eee" stroke="#555"/>
    <text x="246" y="319" text-anchor="middle" font-size="14">Keeping track</text>
    <text x="246" y="336" text-anchor="middle" font-size="12">(answers adaptation)</text>

    <path d="M 380 197 Q 420 240 412 296" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrg)"/>
    <path d="M 372 348 Q 325 392 280 348" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrg)"/>
    <path d="M 236 296 Q 228 240 268 197" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#arrg)"/>

    <text x="325" y="500" text-anchor="middle" font-size="14" font-style="italic">The cycle the people at the lower corners repeat, one exchange at a time</text>
  </g>
</svg>
