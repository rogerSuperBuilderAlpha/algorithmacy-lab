name: update-directory

# Keeps the generated surfaces current: the directory in README.md, MAP.md, and the research-watch
# INDEX.md. On a pull request from this repo, it regenerates all three and commits the result back to
# the PR branch, so a contributor who adds an experiment does not have to remember to run the
# generators. The `directory-current`, `map-current`, and `research-index-current` checks in
# ci/reproduce.json are the safety net: on fork PRs (where this job cannot push) a stale file fails CI,
# and the contributor runs the generator themselves.

on:
  pull_request:
    branches: [contrib, main]

permissions:
  contents: write

concurrency:
  group: update-directory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # Skip on fork PRs: the token is read-only there and cannot push. The CI gate covers them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The generators use only the standard library, so no dependency install is needed.
      - name: Regenerate the directory, the map, and the research index
        run: |
          python tools/build_index.py
          python tools/build_map.py
          python org_frontier/research/build_research_index.py
          python org_frontier/research/build_cards_index.py

      - name: Commit if any generated surface changed
        run: |
          if git diff --quiet -- README.md MAP.md org_frontier/research/INDEX.md org_frontier/research/*/literature/REFERENCES.md; then
            echo "Directory, map, research index, and reference-card indexes already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MAP.md org_frontier/research/INDEX.md org_frontier/research/*/literature/REFERENCES.md
          git commit -m "docs: regenerate README directory, MAP, research index, and reference-card indexes [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
