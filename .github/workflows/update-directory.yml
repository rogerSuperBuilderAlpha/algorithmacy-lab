name: update-directory

# Keeps the generated surfaces current: the directory in README.md, MAP.md, catalog.json, and the
# research-watch INDEX.md. On a pull request from this repo, it regenerates them and commits the result back to
# the PR branch, so a contributor who adds an experiment does not have to remember to run the
# generators. The `directory-current`, `map-current`, `catalog-current`, and `research-index-current` checks in
# ci/reproduce.json are the safety net: on fork PRs (where this job cannot push) a stale file fails CI,
# and the contributor runs the generator themselves.

on:
  pull_request:
    branches: [contrib, main]

permissions:
  contents: write

concurrency:
  group: update-directory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # Skip on fork PRs: the token is read-only there and cannot push. The CI gate covers them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The generators use only the standard library, so no dependency install is needed.
      - name: Regenerate the directory, the map, the catalog, and the research index
        run: |
          python tools/build_index.py
          python tools/build_map.py
          python tools/build_catalog.py
          python org_frontier/research/build_research_index.py
          python org_frontier/research/build_cards_index.py
          python research-atlas/build_cards.py

      - name: Commit generated indexes before pinning their revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MAP.md catalog.json org_frontier/research/INDEX.md org_frontier/research/*/literature/REFERENCES.md research-atlas/cards.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate directory and research indexes [skip ci]"
          fi

      - name: Pin the committed indexes and source revision
        run: |
          python research-atlas/build_snapshot.py
          git add research-atlas/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: pin atlas snapshot [skip ci]"
          fi
          git push origin HEAD:${{ github.head_ref }}
